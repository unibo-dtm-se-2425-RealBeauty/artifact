[tool.poetry]
name = "realbeauty"
packages = [
    { include = "artifact" },
]
version = "1.0.0"
description = "Analyze personal care product ingredients for safety using AI"
authors = ["Serra Özkasap <serra.ozkasap@studio.unibo.it>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
# update the Python versions in .github/workflows/check.yml if you change this
python = ">=3.10.0,<4.0.0"
flask = "^3.1.3"
requests = "^2.34.2"
openai = "^2.42.0"
sqlalchemy = "^2.0.51"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.37.0"
poetry = "^1.8.3"
pytest = "^8.3.5"
ruff = "^0.15.0"

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy artifact tests"
compile = "python -m compileall artifact tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
